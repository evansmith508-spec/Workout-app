        <span style="font-size: 13px; color: #5E6573">This week vs plan</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">

        <div style="height: 8px; border-radius: 4px; background: #EEF0F3; overflow: hidden"><div style="width: 50%; height: 100%; border-radius: 4px; background: #2563EB"></div></div>

        <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">Quads</span><span style="color: #5E6573"><strong style="color: #0B0D12">4</strong> / 8</span></div>

        <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">Back</span><span style="color: #5E6573"><strong style="color: #0B0D12">6</strong> / 12</span></div>
