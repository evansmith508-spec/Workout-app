<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finish workout</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563EB;text-decoration:none}a:hover{color:#1D4ED8}
</style>
</head>
<body style="background:#E9EBEE">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Inter, system-ui, sans-serif; color: #0B0D12; display: flex; flex-direction: column; overflow: hidden; font-feature-settings: 'tnum'">

  <header style="height: 60px; flex-shrink: 0; padding: 8px 12px 0; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box">
    <a href="02-workout.html" style="height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: #2563EB">Back</a>
    <span style="font-size: 16px; font-weight: 700">Finish workout</span>
    <span style="width: 56px"></span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Lower A</h1>
        <span style="font-size: 13px; color: #5E6573">Tue · 52 min</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: #F4F5F7; border-radius: 12px"><span style="font-size: 19px; font-weight: 700">16/16</span><span style="font-size: 12px; color: #5E6573">Sets</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: #F4F5F7; border-radius: 12px"><span style="font-size: 19px; font-weight: 700">3/10</span><span style="font-size: 12px; color: #5E6573">Peak pain</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: #F4F5F7; border-radius: 12px"><span style="font-size: 19px; font-weight: 700">1</span><span style="font-size: 12px; color: #5E6573">New best</span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #FFF4E5; border-radius: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"></path></svg>
        <span style="font-size: 13px; color: #6B3E06"><strong>Back Squat</strong> · e1RM 91 kg (estimate), up 2.5 kg</span>
      </div>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 700">Session effort (RPE)</legend>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">1</button>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">2</button>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">3</button>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">4</button>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">5</button>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">6</button>
        <button aria-pressed="true" style="height: 44px; border: 0; border-radius: 10px; background: #2563EB; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF">7</button>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">8</button>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">9</button>
        <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #0B0D12">10</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 700">Nausea</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; background: #E5E7EB; border-radius: 12px; padding: 3px">
        <button style="height: 40px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">None</button>
        <button aria-pressed="true" style="height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(16,24,40,0.12); font: inherit; font-size: 14px; font-weight: 700; color: #0B0D12">Mild</button>
        <button style="height: 40px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">Moderate</button>
        <button style="height: 40px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">Vomited</button>
      </div>
      <span style="font-size: 13px; font-weight: 600; color: #5E6573; margin-top: 4px">When did it hit?</span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button style="height: 36px; padding: 0 14px; border: 1px solid #D5D8DE; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">Start</button>
        <button style="height: 36px; padding: 0 14px; border: 1px solid #D5D8DE; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">Middle</button>
        <button aria-pressed="true" style="height: 36px; padding: 0 14px; border: 1px solid #0B0D12; border-radius: 999px; background: #0B0D12; font: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF">End</button>
        <button style="height: 36px; padding: 0 14px; border: 1px solid #D5D8DE; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">After</button>
      </div>
    </fieldset>

    <div style="background: #FFFFFF; border-radius: 16px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; min-height: 60px; border-bottom: 1px solid #EEF0F3">
        <span style="font-size: 15px; font-weight: 600">Hours since last meal</span>
        <div style="display: flex; align-items: center; gap: 4px">
          <button aria-label="Decrease hours" style="width: 44px; height: 40px; border: 0; border-radius: 10px; background: #EEF0F3; font: inherit; font-size: 18px; font-weight: 700; color: #0B0D12">−</button>
          <span style="width: 44px; text-align: center; font-size: 16px; font-weight: 700">2.5</span>
          <button aria-label="Increase hours" style="width: 44px; height: 40px; border: 0; border-radius: 10px; background: #EEF0F3; font: inherit; font-size: 18px; font-weight: 700; color: #0B0D12">+</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 14px">
        <span style="font-size: 15px; font-weight: 600">Meal size</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <button style="height: 40px; border: 0; border-radius: 10px; background: #F4F5F7; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">Fasted</button>
          <button aria-pressed="true" style="height: 40px; border: 0; border-radius: 10px; background: #E6EDFD; box-shadow: inset 0 0 0 1.5px #2563EB; font: inherit; font-size: 14px; font-weight: 700; color: #1E40AF">Snack</button>
          <button style="height: 40px; border: 0; border-radius: 10px; background: #F4F5F7; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">Meal</button>
          <button style="height: 40px; border: 0; border-radius: 10px; background: #F4F5F7; font: inherit; font-size: 14px; font-weight: 600; color: #3F4752">Large</button>
        </div>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 15px; font-weight: 700">Notes</span>
      <textarea placeholder="How did the hamstring feel?" style="height: 56px; border: 0; border-radius: 14px; background: #FFFFFF; padding: 12px 14px; font: inherit; font-size: 15px; color: #0B0D12; resize: none; box-sizing: border-box"></textarea>
    </label>
  </div>

  <div style="flex-shrink: 0; padding: 0 16px 28px">
    <a href="01-today.html" style="height: 54px; border-radius: 14px; background: #2563EB; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Save workout</a>
  </div>
</div>
</body>
</html>
